  body { margin:0; background:var(--bg); color:var(--ink); font:300 14px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; }

  .seg { display:inline-flex; border:1px solid var(--line); }
  .seg button { appearance:none; border:0; background:transparent; color:var(--dim); padding:8px 14px; cursor:pointer;
                font:400 10px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing:2.5px; text-transform:uppercase; }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--bg); }
  .seg button:focus-visible { outline:1px solid var(--accent); outline-offset:2px; }
  main { display:flex; gap:32px; padding:32px 24px 64px; overflow-x:auto; align-items:flex-start; }
  .card { flex:0 0 auto; }
  .meta { margin:0 0 14px; max-width:600px; }
  .meta .label { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--accent); }
  .meta .file { float:right; font:12px/1.4 ui-monospace, Menlo, monospace; color:var(--dim); }
  .meta .subject { margin-top:6px; font:400 18px/1.3 Georgia, serif; color:var(--ink); }
  .meta .pre { color:var(--dim); font-size:12px; }
  .frame { border:1px solid var(--line); background:var(--panel); }
  iframe { display:block; border:0; width:600px; height:900px; background:#131210; }
  footer { padding:0 24px 40px; color:var(--dim); font-size:12px; }

          </tr>\n\n          <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 BLOCK: INTRO / GUIDE \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n          <tr>\n            <td class=\"bg-page px pt\" bgcolor=\"#F6F3EE\" align=\"center\" style=\"padding:72px 64px 24px; background-color:#F6F3EE;\">\n              <p class=\"sans t-accent\" style=\"margin:0 0 22px; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:11px; line-height:16px; letter-spacing:4px; text-transform:uppercase; color:#8F7A52;\">A quiet guide</p>\n              <h1 class=\"serif t-ink h1\" style=\"margin:0 0 28px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:42px; line-height:48px; font-weight:300; color:#1F1D1A;\">How to choose a piece that feels like&nbsp;yours</h1>\n              <p class=\"sans t-muted\" style=\"margin:0 0 8px; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:15px; line-height:26px; font-weight:300; color:#5E584F;\">There are no rules here. Only a few gentle cues worth listening to.</p>\n              <table role=\"presentation\" width=\"48\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\" style=\"margin:36px auto 44px;\">\n                <tr><td class=\"bd-line\" height=\"1\" style=\"height:1px; border-top:1px solid #DCD4C7; font-size:0; line-height:0;\">&nbsp;</td></tr>\n              </table>\n              <!-- list item 1 -->\n              <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"padding:0 0 34px;\">\n                    <p class=\"serif t-accent\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:15px; line-height:20px; font-style:italic; color:#8F7A52;\">01</p>\n                    <h3 class=\"serif t-ink\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:23px; line-height:28px; font-weight:400; color:#1F1D1A;\">Start with what you reach for</h3>\n                    <p class=\"sans t-muted\" style=\"margin:0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:14px; line-height:24px; font-weight:300; color:#5E584F;\">Notice the pieces you already wear without thinking. They know your taste better than any trend.</p>\n                  </td>\n                </tr>\n              </table>\n              <!-- list item 2 -->\n              <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"padding:0 0 34px;\">\n                    <p class=\"serif t-accent\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:15px; line-height:20px; font-style:italic; color:#8F7A52;\">02</p>\n                    <h3 class=\"serif t-ink\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:23px; line-height:28px; font-weight:400; color:#1F1D1A;\">Consider the scale</h3>\n                    <p class=\"sans t-muted\" style=\"margin:0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:14px; line-height:24px; font-weight:300; color:#5E584F;\">Fine pieces feel intimate; bolder forms speak a little louder. Choose the voice that suits your day.</p>\n                  </td>\n                </tr>\n              </table>\n              <!-- list item 3 -->\n              <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"padding:0 0 34px;\">\n                    <p class=\"serif t-accent\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:15px; line-height:20px; font-style:italic; color:#8F7A52;\">03</p>\n                    <h3 class=\"serif t-ink\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:23px; line-height:28px; font-weight:400; color:#1F1D1A;\">Trust your skin</h3>\n                    <p class=\"sans t-muted\" style=\"margin:0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:14px; line-height:24px; font-weight:300; color:#5E584F;\">Warm or cool, polished or soft. Hold it close and trust the first impression.</p>\n                  </td>\n                </tr>\n              </table>\n              <!-- list item 4 -->\n              <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"padding:0 0 0px;\">\n                    <p class=\"serif t-accent\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:15px; line-height:20px; font-style:italic; color:#8F7A52;\">04</p>\n                    <h3 class=\"serif t-ink\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:23px; line-height:28px; font-weight:400; color:#1F1D1A;\">Leave room to layer</h3>\n                    <p class=\"sans t-muted\" style=\"margin:0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:14px; line-height:24px; font-weight:300; color:#5E584F;\">Begin with one piece. Let the rest arrive in their own time.</p>\n                  </td>\n                </tr>\n              </table>\n              <p class=\"t-accent\" style=\"margin:44px 0 34px; font-family:Georgia, serif; font-size:11px; line-height:14px; color:#8F7A52;\">&#10022;</p>\n              <!-- BUTTON: edit label and href. Thin outline on purpose: quiet, not pushy. -->\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\" style=\"margin:0px     <tr><td class=\"bd-line\" height=\"1\" style=\"height:1px; border-top:1px solid #DCD4C7; font-size:0; line-height:0;\">&nbsp;</td></tr>\n              </table>\n              <!-- list item 1 -->\n              <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"padding:0 0 34px;\">\n                    <p class=\"serif t-accent\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:15px; line-height:20px; font-style:italic; color:#8F7A52;\">01</p>\n                    <h3 class=\"serif t-ink\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:23px; line-height:28px; font-weight:400; color:#1F1D1A;\">Start with what you reach for</h3>\n                    <p class=\"sans t-muted\" style=\"margin:0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:14px; line-height:24px; font-weight:300; color:#5E584F;\">Notice the pieces you already wear without thinking. They know your taste better than any trend.</p>\n                  </td>\n                </tr>\n              </table>\n              <!-- list item 2 -->\n              <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"padding:0 0 34px;\">\n                    <p class=\"serif t-accent\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:15px; line-height:20px; font-style:italic; color:#8F7A52;\">02</p>\n                    <h3 class=\"serif t-ink\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:23px; line-height:28px; font-weight:400; color:#1F1D1A;\">Consider the scale</h3>\n                    <p class=\"sans t-muted\" style=\"margin:0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:14px; line-height:24px; font-weight:300; color:#5E584F;\">Fine pieces feel intimate; bolder forms speak a little louder. Choose the voice that suits your day.</p>\n                  </td>\n                </tr>\n              </table>\n              <!-- list item 3 -->\n              <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"padding:0 0 34px;\">\n                    <p class=\"serif t-accent\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:15px; line-height:20px; font-style:italic; color:#8F7A52;\">03</p>\n                    <h3 class=\"serif t-ink\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:23px; line-height:28px; font-weight:400; color:#1F1D1A;\">Trust your skin</h3>\n                    <p class=\"sans t-muted\" style=\"margin:0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:14px; line-height:24px; font-weight:300; color:#5E584F;\">Warm or cool, polished or soft. Hold it close and trust the first impression.</p>\n                  </td>\n                </tr>\n              </table>\n              <!-- list item 4 -->\n              <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"padding:0 0 0px;\">\n                    <p class=\"serif t-accent\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:15px; line-height:20px; font-style:italic; color:#8F7A52;\">04</p>\n                    <h3 class=\"serif t-ink\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:23px; line-height:28px; font-weight:400; color:#1F1D1A;\">Leave room to layer</h 476; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:12px;\">\n              </a>\n            </td>\n          </tr>\n\n          <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 BLOCK: THANK YOU \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n          <tr>\n            <td class=\"bg-page px pt\" bgcolor=\"#F6F3EE\" align=\"center\" style=\"padding:72px 64px 24px; background-color:#F6F3EE;\">\n              <p class=\"sans t-accent\" style=\"margin:0 0 22px; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:11px; line-height:16px; letter-spacing:4px; text-transform:uppercase; color:#8F7A52;\">Thank you</p>\n              <h1 class=\"serif t-ink h1\" style=\"margin:0 0 28px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:42px; line-height:48px; font-weight:300; color:#1F1D1A;\">Thank you, Alex.</h1>\n              <p class=\"sans t-muted\" style=\"margin:0 0 0px; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:15px; line-height:26px; font-weight:300; color:#5E584F;\">Your order has been received and is being prepared with care. We&rsquo;ll let you know as soon as it&rsquo;s on its way.</p>\n              <table role=\"presentation\" width=\"48\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\" style=\"margin:48px auto 48px;\">\n                <tr><td class=\"bd-line\" height=\"1\" style=\"height:1px; border-top:1px solid #DCD4C7; font-size:0; line-height:0;\">&nbsp;</td></tr>\n              </table>\n              <h2 class=\"serif t-ink h2\" style=\"margin:0 0 18px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:32px; line-height:38px; font-weight:300; color:#1F1D1A;\">Keeping it beautiful</h2>\n              <p class=\"sans t-muted\" style=\"margin:0 0 40px; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:15px; line-height:26px; font-weight:300; color:#5E584F;\">A few small habits keep jewelry luminous for years.</p>\n              <!-- list item 1 -->\n              <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"padding:0 0 34px;\">\n                    <p class=\"serif t-accent\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:15px; line-height:20px; font-style:italic; color:#8F7A52;\">i.</p>\n                    <h3 class=\"serif t-ink\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:23px; line-height:28px; font-weight:400; color:#1F1D1A;\">Last on, first off</h3>\n                    <p class=\"sans t-muted\" style=\"margin:0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:14px; line-height:24px; font-weight:300; color:#5E584F;\">Put your jewelry on after perfume, lotion and hairspray, and take it off first at the end of the day.</p>\n                  </td>\n                </tr>\n              </table>\n              <!-- list item 2 -->\n              <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"padding:0 0 34px;\">\n                    <p class=\"serif t-accent\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:15px; line-height:20px; font-style:italic; color:#8F7A52;\">ii.</p>\n                    <h3 class=\"serif t-ink\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:23px; line-height:28px; font-weight:400; color:#1F1D1A;\">Keep it dry</h3>\n                    <p class=\"sans t-muted\" style=\"margin:0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:14px; line-height:24px; font-weight:300; color:#5E584F;\">Remove it before swimming, showering or exercise.</p>\n                  </td>\n                </tr>\n              </table>\n              <!-- list item 3 -->\n              <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"padding:0 0 34px;\">\n                    <p class=\"serif t-accent\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:15px; line-height:20px; font-style:italic; color:#8F7A52;\">iii.</p>\n                    <h3 class=\"serif t-ink\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:23px; line-height:28px; font-weight:400; color:#1F1D1A;\">Store it apart</h3>\n                    <p class=\"sans t-muted\" style=\"margin:0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:14px; line-height:24px; font-weight:300; color:#5E584F;\">Rest each piece on its own in a soft pouch, away from humidity and direct sun.</p>\n                  </td>\n                </tr>\n              </table>\n              <!-- list item 4 -->\n              <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"padding:0 0 0px;\">\n                    <p class=\"serif t-accent\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:15px; line-height:20px; font-style:italic; color:#8F7A52;\">iv.</p>\n                    <h3 class=\"serif t-ink\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:23px; line-height:28px; font-weight:400; color:#1F1D1A;\">Polish gently</h3>\n                    <p class=\"sans t-muted\" style=\"margin:0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:14px; line-height:24px; class=\"serif t-ink h1\" style=\"margin:0 0 28px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:42px; line-height:48px; font-weight:300; color:#1F1D1A;\">Thank you.</h1>\n              <p class=\"sans t-muted\" style=\"margin:0 0 0px; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:15px; line-height:26px; font-weight:300; color:#5E584F;\">Your order has been received and is being prepared with care. We&rsquo;ll let you know as soon as it&rsquo;s on its way.</p>\n              <table role=\"presentation\" width=\"48\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\" style=\"margin:48px auto 48px;\">\n                <tr><td class=\"bd-line\" height=\"1\" style=\"height:1px; border-top:1px solid #DCD4C7; font-size:0; line-height:0;\">&nbsp;</td></tr>\n              </table>\n              <h2 class=\"serif t-ink h2\" style=\"margin:0 0 18px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:32px; line-height:38px; font-weight:300; color:#1F1D1A;\">Keeping it beautiful</h2>\n              <p class=\"sans t-muted\" style=\"margin:0 0 40px; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:15px; line-height:26px; font-weight:300; color:#5E584F;\">A few small habits keep jewelry luminous for years.</p>\n              <!-- list item 1 -->\n              <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"padding:0 0 34px;\">\n                    <p class=\"serif t-accent\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:15px; line-height:20px; font-style:italic; color:#8F7A52;\">i.</p>\n                    <h3 class=\"serif t-ink\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:23px; line-height:28px; font-weight:400; color:#1F1D1A;\">Last on, first off</h3>\n                    <p class=\"sans t-muted\" style=\"margin:0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:14px; line-height:24px; font-weight:300; color:#5E584F;\">Put your jewelry on after perfume, lotion and hairspray, and take it off first at the end of the day.</p>\n                  </td>\n                </tr>\n              </table>\n              <!-- list item 2 -->\n              <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"padding:0 0 34px;\">\n                    <p class=\"serif t-accent\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:15px; line-height:20px; font-style:italic; color:#8F7A52;\">ii.</p>\n                    <h3 class=\"serif t-ink\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:23px; line-height:28px; font-weight:400; color:#1F1D1A;\">Keep it dry</h3>\n                    <p class=\"sans t-muted\" style=\"margin:0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:14px; line-height:24px; font-weight:300; color:#5E584F;\">Remove it before swimming, showering or exercise.</p>\n                  </td>\n                </tr>\n              </table>\n              <!-- list item 3 -->\n              <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"padding:0 0 34px;\">\n                    <p class=\"serif t-accent\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:15px; line-height:20px; font-style:italic; color:#8F7A52;\">iii.</p>\n                    <h3 class=\"serif t-ink\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:23px; line-height:28px; font-weight:400; color:#1F1D1A;\">Store it apart</h3>\n                    <p class=\"sans t-muted\" style=\"margin:0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:14px; line-height:24px; font-weight:300; color:#5E584F;\">Rest each piece on its own in a soft pouch, away from humidity and direct sun.</p>\n                  </td>\n                </tr>\n              </table>\n              <!-- list item 4 -->\n              <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"padding:0 0 0px;\">\n                    <p class=\"serif t-accent\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:15px; line-height:20px; font-style:italic; color:#8F7A52;\">iv.</p>\n                    <h3 class=\"serif t-ink\" style=\"margin:0 0 8px; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:23px; line-height:28px; font-weight:400; color:#1F1D1A;\">Polish gently</h3>\n                    <p class=\"sans t-muted\" style=\"margin:0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:14px; line-height:24px; font-weight:300; color:#5E584F;\">A soft, dry cloth is all it needs. Avoid harsh cleaners.</p>\n                  </td>\n                </tr>\n              </table>\n              <p class=\"t-accent\" style=\"margin:44px 0 34px; font-family:Georgia, serif; font-size:11px; line-height:14px; color:#8F7A52;\">&#10022;</p>\n              <!-- BUTTON: edit label and href. Thin outline on purpose: quiet, not pushy. -->\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\" style=\"margin:0px auto 40px;\">\n                <tr>\n                  <td class=\"btn-td\" align=\"center\" style=\"border:1px solid #1F1D1A; mso-padding-alt:0;\">\n                    <a class=\"b   const state = { width: "600", theme: "light", name: "named", zoom: "1" };
  const grid = document.getElementById("grid");

  function source(c) {
    let s = c[state.name];
    if (state.theme === "dark") s = s.replace(/@media\s*\(prefers-color-scheme:\s*dark\)/g, "@media all");
    return s;
  }
  function fit(f) {
    try { f.style.height = f.contentDocument.documentElement.scrollHeight + "px"; } catch (e) {}
  }
  function render() {
    grid.innerHTML = "";
    DATA.forEach(c => {
      const card = document.createElement("section");
      card.className = "card";
      card.style.zoom = state.zoom;
      card.innerHTML = '<div class="meta" style="width:' + state.width + 'px"><span class="file"></span><div class="label"></div>' +
                       '<div class="subject"></div><div class="pre"></div></div><div class="frame"><iframe></iframe></div>';
      card.querySelector(".file").textContent = c.file + " · " + c.kb + " KB";
      card.querySelector(".label").textContent = c.label;
      card.querySelector(".subject").textContent = c.subject;
      card.querySelector(".pre").textContent = c.preheader;
      const f = card.querySelector("iframe");
      f.title = c.label;
      f.style.width = state.width + "px";
      f.addEventListener("load", () => { fit(f); setTimeout(() => fit(f), 600); });
      f.srcdoc = source(c);
      grid.appendChild(card);
    });
  }
  document.querySelectorAll(".seg").forEach(seg => {
    seg.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
      state[seg.dataset.key] = b.dataset.v;
      render();
    });
  });
  render();
</script>
